name: CI

# Runs the checks that tend to silently rot. Deliberately unguarded steps: a
# non-zero exit fails the job. See CONTRIBUTING.md.
#
# `vv-gate-selftest` is a NETWORK test — it talks to the deployed service,
# because the point of the gate is that the adjudicator is not local. If the
# service is down, this job goes red. That is intended: a gate you cannot reach
# is a gate you do not have.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'   # floor declared in pyproject.toml

      - name: Compile all Python
        run: python -m compileall -q src mcp skills examples

      - name: JSON assets parse
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              json.loads(p.read_text(encoding='utf-8'))
              print('ok', p)
          PY

  no-dependencies-in-gate:
    # Hard invariant: skills/vv-gate/ must run with no build step inside someone
    # else's harness. Enforce it mechanically so review does not have to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert vv-gate imports stdlib only
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          ALLOWED = {
              'argparse', 'json', 'os', 'sys', 'urllib', 'typing', 'pathlib',
              'io', 'contextlib', 'importlib', 'hashlib', 'time', 're', 'math',
              'collections', 'dataclasses', 'functools', 'itertools', 'textwrap',
              'shlex', 'subprocess', 'tempfile', 'random', 'statistics', 'logging',
              'datetime', 'enum', 'operator', 'traceback', 'copy', 'unittest',
          }
          bad = []
          for f in pathlib.Path('skills/vv-gate').rglob('*.py'):
              tree = ast.parse(f.read_text(encoding='utf-8'), filename=str(f))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split('.')[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [(node.module or '').split('.')[0]] if node.level == 0 else []
                  else:
                      continue
                  for n in names:
                      if n and n not in ALLOWED:
                          bad.append(f'{f}:{node.lineno} imports {n!r}')
          for b in bad:
              print('BLOCKED', b)
          sys.exit(1 if bad else 0)
          PY

  vv-gate-selftest:
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Live smoke test against the deployed service
        run: python skills/vv-gate/tests/run_selftest.py
      - name: Client selftest
        run: python skills/vv-gate/scripts/vv_gate.py selftest

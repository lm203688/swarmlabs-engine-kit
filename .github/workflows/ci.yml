name: CI

# Runs the checks that tend to silently rot. Deliberately unguarded steps: a
# non-zero exit fails the job. See CONTRIBUTING.md.
#
# The two live jobs talk to the deployed service, because the point of the gate
# is that the adjudicator is not local. Their exit codes are load-bearing:
#
#   0  pass
#   1  a behavioural regression (a real 4xx the API should not return, a broken
#      assertion, a contract change) -> fail the job immediately, do NOT retry
#   4  UNREACHABLE: no verdict was produced (Cloudflare 403/1010, a 200 with an
#      empty body, a network failure). -> retry once, then fail
#
# Why retry 4 but not 1: the upstream anomalies are measured to be
# non-deterministic (run #29 and #30 carried byte-identical code and differed
# only in a docs file, yet one went green and one red). A retry driven by the
# exit code is honest — it retries only the "no answer" case. Setting
# `continue-on-error: true` would instead hide genuine regressions, and mapping
# 4 to success would mean the pipeline proceeds when nobody adjudicated anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'   # floor declared in pyproject.toml

      - name: Compile all Python
        run: python -m compileall -q src skills examples mcp_server.py vv_gate_server.py

      - name: MCP server and quickstart run from a fresh clone (no install)
        run: |
          python mcp_server.py --help > /dev/null
          python vv_gate_server.py --help > /dev/null
          python -c "import ast; ast.parse(open('examples/quickstart.py').read())"

  vv-gate-server-selftest:
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Assert the stdio MCP server still speaks MCP
        # Drives a real protocol session: initialize, tools/list, and one live
        # tools/call against the deployed service. It has no third-party deps,
        # so there is nothing to install first - which is the point.
        run: |
          set +e
          python vv_gate_server.py --selftest
          rc=$?
          if [ "$rc" = "4" ]; then
            echo "::warning::unreachable (exit 4) - no verdict was produced; retrying once"
            sleep 5
            python vv_gate_server.py --selftest
            rc=$?
          fi
          if [ "$rc" = "4" ]; then
            echo "::error::still unreachable after a retry - the gate cannot be consulted"
          fi
          exit $rc

      - name: JSON assets parse
        # 一行式，避免 YAML block scalar 的缩进被原样喂给 python 引发的
        # IndentationError 隐患（heredoc 在本文件里能跑通，但依赖缩进恰好合法，
        # 不值得把正确性押在缩进上）。
        run: >-
          python -c "import json,pathlib; ps=[p for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts];
          [json.loads(p.read_text(encoding='utf-8')) for p in ps]; print('parsed',len(ps),'json files')"

  no-dependencies-in-gate:
    # Hard invariant: skills/vv-gate/ must run with no build step inside someone
    # else's harness. Enforced mechanically so review does not have to be the
    # thing that catches it — a third-party import would not even show up in the
    # live smoke test on a machine that happens to have the dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Assert vv-gate imports stdlib only
        run: python skills/vv-gate/tests/check_stdlib_only.py

  vv-gate-selftest:
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Live smoke test against the deployed service
        # Groups A, B, B2, B3, I and J are fully local (they stand up their own
        # fake servers), so an unreachable upstream still exercises the transport
        # contract before bailing out with 4.
        run: |
          set +e
          python skills/vv-gate/tests/run_selftest.py
          rc=$?
          if [ "$rc" = "4" ]; then
            echo "::warning::unreachable (exit 4) - no verdict was produced; retrying once"
            sleep 5
            python skills/vv-gate/tests/run_selftest.py
            rc=$?
          fi
          if [ "$rc" = "4" ]; then
            echo "::error::still unreachable after a retry - the gate cannot be consulted"
          fi
          exit $rc
      - name: Client selftest
        run: |
          set +e
          python skills/vv-gate/scripts/vv_gate.py selftest
          rc=$?
          if [ "$rc" = "4" ]; then
            echo "::warning::unreachable (exit 4) - retrying once"
            sleep 5
            python skills/vv-gate/scripts/vv_gate.py selftest
            rc=$?
          fi
          if [ "$rc" = "4" ]; then
            echo "::error::still unreachable after a retry - the gate cannot be consulted"
          fi
          exit $rc
